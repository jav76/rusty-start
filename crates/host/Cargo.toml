[package]
name = "rusty-start-host"
description = "Resident process that owns the Rusty Start UI, app index and search."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "rusty-start"
path = "src/main.rs"

[features]
# Forces the preview backend (sample apps, synthetic backdrop, logged power actions) on any OS.
preview = []

[dependencies]
anyhow.workspace = true
glow.workspace = true
rusty-start-protocol.workspace = true
slint = { workspace = true, features = ["std", "compat-1-2", "backend-winit", "renderer-femtovg", "accessibility", "unstable-winit-030"] }

[target.'cfg(target_os = "linux")'.dependencies]
png.workspace = true
resvg.workspace = true
rustix.workspace = true
wayland-client.workspace = true
wayland-protocols-plasma.workspace = true
zbus.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Shutdown",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build.workspace = true

[lints]
workspace = true

# `cargo deb -p rusty-start-host` builds the Linux package. The binary goes to the path the desktop
# entry and D-Bus service name, because KWin authorizes screenshots by executable path.
[package.metadata.deb]
name = "rusty-start"
section = "x11"
priority = "optional"
depends = "$auto"
extended-description = """\
A fast app launcher for KDE Plasma on Wayland, opened with the Meta key. It lists installed apps \
with pinned and recent apps first, searches as you type, and offers lock, sign out, sleep, \
restart and shut down. Run `rusty-start setup` once per user to bind the Meta key."""
assets = [
    ["target/release/rusty-start", "usr/bin/", "755"],
    ["../../packaging/linux/io.github.jav76.RustyStart.desktop", "usr/share/applications/", "644"],
    ["../../packaging/linux/io.github.jav76.RustyStart.service", "usr/share/dbus-1/services/", "644"],
    ["../../README.md", "usr/share/doc/rusty-start/", "644"],
]
