name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_DEB_VERSION: 3.8.0
  CARGO_XWIN_VERSION: 0.23.1

# Every target is built on the project's self-hosted x86_64 Linux runner: arm64 Linux is cross-linked
# against Debian's multiarch libraries, and Windows is cross-compiled with cargo-xwin. None of the
# cross builds are run in CI.
#
# `create` checks the tag against Cargo.toml and CHANGELOG.md and opens one draft release with the
# changelog section as its notes; the build jobs upload into it; `publish` adds SHA256SUMS over
# every asset and takes the release out of draft, so a half-built release is never public.
jobs:
  create:
    name: Create the draft release
    runs-on: [self-hosted, Linux, X64, rusty-start]
    container: debian:bookworm
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git gh

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag against Cargo.toml and the changelog
        run: |
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          grep -q "^## \[$version\]" CHANGELOG.md || {
            echo "CHANGELOG.md has no '## [$version]' section"
            exit 1
          }
          # The section body, up to the next version heading.
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { active = 1; next }
            /^## / { active = 0 }
            active { print }
          ' CHANGELOG.md > notes.md
          echo "Release notes:"
          cat notes.md

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          # A re-run of the workflow finds the draft from the first run.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft $prerelease --verify-tag \
                 --title "$GITHUB_REF_NAME" --notes-file notes.md

  linux:
    name: Linux ${{ matrix.arch }}
    needs: create
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            target: aarch64-unknown-linux-gnu
    runs-on: [self-hosted, Linux, X64, rusty-start]
    # Bookworm's glibc (2.36) is the oldest the binaries support, so they also run on Debian 13
    # and Ubuntu 24.04.
    container: debian:bookworm
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      # Bookworm ships no aarch64 pkg-config wrapper, so point pkg-config at the multiarch .pc files.
      PKG_CONFIG_ALLOW_CROSS: 1
      PKG_CONFIG_LIBDIR_aarch64_unknown_linux_gnu: /usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config libfontconfig-dev dpkg-dev gh

      - name: Install arm64 cross toolchain
        if: matrix.arch == 'arm64'
        run: |
          dpkg --add-architecture arm64
          apt-get update
          apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross libfontconfig-dev:arm64

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build -p rusty-start-host --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          cargo install cargo-deb --version "$CARGO_DEB_VERSION" --locked
          cargo deb -p rusty-start-host --no-build --target ${{ matrix.target }} --output target/dist/
          # A pre-release suffix must sort below the final version in apt: 0.2.0~beta.1-1 < 0.2.0-1.
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          expected="$(printf '%s' "$version" | tr - '~')-1"
          actual="$(dpkg-deb -f target/dist/*.deb Version)"
          if [ "$actual" != "$expected" ]; then
            echo "the .deb version is $actual, expected $expected"
            exit 1
          fi
          staging="rusty-start-${GITHUB_REF_NAME}-linux-${{ matrix.arch }}"
          mkdir -p "target/dist/$staging"
          cp target/${{ matrix.target }}/release/rusty-start packaging/linux/* README.md LICENSE "target/dist/$staging/"
          tar -C target/dist -czf "target/dist/$staging.tar.gz" "$staging"

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release upload "$GITHUB_REF_NAME" target/dist/*.deb target/dist/*.tar.gz --clobber

  windows:
    name: Windows ${{ matrix.arch }}
    needs: create
    strategy:
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            xwin_arch: x86_64
          - arch: arm64
            target: aarch64-pc-windows-msvc
            xwin_arch: aarch64
    runs-on: [self-hosted, Linux, X64, rusty-start]
    container: debian:bookworm
    env:
      # cargo-xwin downloads the MSVC CRT and Windows SDK, which accepts Microsoft's license for them:
      # https://go.microsoft.com/fwlink/?LinkId=2086102
      XWIN_ARCH: ${{ matrix.xwin_arch }}
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential clang lld llvm zip gh

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cargo-xwin
        run: cargo install cargo-xwin --version "$CARGO_XWIN_VERSION" --locked

      - name: Build
        env:
          # Links the C runtime statically, so the executable does not depend on the Visual C++
          # Redistributable (VCRUNTIME140.dll) being installed.
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo xwin build --workspace --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          staging="rusty-start-${GITHUB_REF_NAME}-windows-${{ matrix.arch }}"
          mkdir -p "target/dist/$staging"
          cp target/${{ matrix.target }}/release/rusty-start.exe README.md LICENSE "target/dist/$staging/"
          (cd target/dist && zip -r "$staging.zip" "$staging")

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release upload "$GITHUB_REF_NAME" target/dist/*.zip --clobber

  publish:
    name: Checksums and publish
    needs: [linux, windows]
    runs-on: [self-hosted, Linux, X64, rusty-start]
    container: debian:bookworm
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates gh

      - name: Add SHA256SUMS over every asset and publish
        run: |
          mkdir assets
          cd assets
          gh release download "$GITHUB_REF_NAME"
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
