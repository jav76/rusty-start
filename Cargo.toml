[workspace]
resolver = "3"
members = ["crates/host", "crates/protocol"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
authors = ["Jaret Varn"]
repository = "https://github.com/jav76/rusty-start"

[workspace.dependencies]
anyhow = "1.0.104"
glow = "0.18.0"
png = { version = "0.18.1", default-features = false }
resvg = { version = "0.48.1", default-features = false }
rustix = { version = "1.1.5", default-features = false, features = ["event", "fs", "pipe", "std"] }
slint = { version = "1.18.1", default-features = false }
slint-build = "1.18.1"
wayland-client = { version = "0.31.15", default-features = false, features = ["system"] }
wayland-protocols-plasma = { version = "0.3.12", default-features = false, features = ["client"] }
windows = "0.62.2"
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
rusty-start-protocol = { path = "crates/protocol" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_unsafe_on_extern = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Unsafe and FFI hygiene.
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
missing_safety_doc = "warn"
mem_forget = "warn"

# Leftovers that must not ship. `todo` and `unwrap_used` are not enabled because Slint's generated
# code (included through `include_modules!`) uses both; AGENTS.md states those rules instead.
dbg_macro = "warn"
print_stdout = "warn"
unimplemented = "warn"
exit = "warn"
rc_buffer = "warn"
str_to_string = "warn"
empty_structs_with_brackets = "warn"
semicolon_if_nothing_returned = "warn"

# Pedantic lints that fight Win32, OpenGL and pixel math, where numeric casts at API boundaries are
# routine. Use `try_from` wherever a value can actually overflow.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"

# Pedantic lints with more noise than value for an application.
doc_markdown = "allow"
if_not_else = "allow"
items_after_statements = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
needless_raw_string_hashes = "allow"
similar_names = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# Release optimizations without the slow link-time steps, for the latency budget test in CI.
[profile.budget]
inherits = "release"
lto = false
codegen-units = 16
strip = false
